name: Job board checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: jobs-server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: local-ci-password
          POSTGRES_DB: jobs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d jobs_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://portfolio:local-ci-password@localhost:5432/jobs_test
      TEST_DATABASE_URL: postgresql://portfolio:local-ci-password@localhost:5432/jobs_test
      JWT_KEY: local-ci-only-signing-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jobs-server/package-lock.json
      - run: npm ci
      - run: node node_modules/prisma/build/index.js generate
      - run: npm run migrate
      - run: npm test
      - run: npm run build
  client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: jobs-web
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jobs-web/package-lock.json
      - run: npm ci
      - run: npm run test:ci -- --runInBand
      - run: npm run build
